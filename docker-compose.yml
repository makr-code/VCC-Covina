# Enhanced Covina Backend - Docker Compose Configuration
# 
# Stellt eine vollständige Multi-Database-Umgebung für das
# Enhanced Covina Backend zur Verfügung.
#
# Usage:
#   docker-compose up -d                    # Start all services
#   docker-compose up -d postgresql couchdb # Start specific services
#   docker-compose down                     # Stop all services
#   docker-compose logs covina-backend      # View backend logs
#
# Environments:
#   - Development: SQLite + PostgreSQL + CouchDB
#   - Staging: PostgreSQL + CouchDB + ChromaDB  
#   - Production: All databases (PostgreSQL + CouchDB + ChromaDB + Neo4j)

version: '3.8'

services:
  # PostgreSQL - Master Registry & Relational Data
  postgresql:
    image: postgres:15-alpine
    container_name: covina_postgresql
    environment:
      POSTGRES_DB: covina_backend
      POSTGRES_USER: covina_user
      POSTGRES_PASSWORD: covina_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./uds3/database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covina_user -d covina_backend"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - covina_network
    restart: unless-stopped

  # CouchDB - Document Storage & Metadata
  couchdb:
    image: couchdb:3.3
    container_name: covina_couchdb
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: covina_admin_password
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./config/couchdb/local.ini:/opt/couchdb/etc/local.d/docker.ini
    ports:
      - "32931:5984"  # Covina-specific port mapping
    healthcheck:
      test: ["CMD", "curl", "-f", "http://admin:covina_admin_password@localhost:5984/_up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - covina_network
    restart: unless-stopped

  # ChromaDB - Vector Storage for Embeddings
  chromadb:
    image: chromadb/chroma:latest
    container_name: covina_chromadb
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
    volumes:
      - chromadb_data:/chroma/chroma
    ports:
      - "32768:8000"  # Covina-specific port mapping
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - covina_network
    restart: unless-stopped

  # Neo4j - Graph Database for Relationships
  neo4j:
    image: neo4j:5.12
    container_name: covina_neo4j
    environment:
      NEO4J_AUTH: neo4j/covina_neo4j_password
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "covina_neo4j_password", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - covina_network
    restart: unless-stopped

  # Enhanced Covina Backend Application
  covina-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: covina_backend_app
    environment:
      # Environment Configuration
      UDS3_ENVIRONMENT: ${UDS3_ENVIRONMENT:-staging}
      
      # Database Connections
      POSTGRESQL_HOST: postgresql
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: covina_backend
      POSTGRESQL_USER: covina_user
      POSTGRESQL_PASSWORD: covina_password
      
      COUCHDB_HOST: couchdb
      COUCHDB_PORT: 5984
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: covina_admin_password
      
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: 8000
      
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: covina_neo4j_password
      
      # Application Configuration
      PYTHONPATH: /app
      PYTHONUNBUFFERED: 1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    ports:
      - "8080:8080"  # Backend API
    depends_on:
      postgresql:
        condition: service_healthy
      couchdb:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - covina_network
    restart: unless-stopped

  # Redis - Caching and Session Management (optional)
  redis:
    image: redis:7-alpine
    container_name: covina_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - covina_network
    restart: unless-stopped

  # Nginx - Reverse Proxy and Load Balancer
  nginx:
    image: nginx:alpine
    container_name: covina_nginx
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/covina.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - covina-backend
    networks:
      - covina_network
    restart: unless-stopped

# Named Volumes for Data Persistence
volumes:
  postgresql_data:
    driver: local
  couchdb_data:
    driver: local
  chromadb_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local
  redis_data:
    driver: local

# Custom Network
networks:
  covina_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16