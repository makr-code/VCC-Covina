; Minimal pgBouncer Configuration (template)
; Date: 2025-10-21
; Adjust host/port/dbname/user/password and auth file before use.

[databases]
; Map a single logical db name to the upstream PostgreSQL server
postgres = host=${POSTGRES_HOST:-192.168.178.94} port=${POSTGRES_PORT:-5432} dbname=${POSTGRES_DB:-postgres} user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres}

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
; Authentication
auth_type = md5
auth_file = userlist.txt

; Pooling mode: transaction is recommended for most API workloads
pool_mode = transaction

; Connection limits
max_client_conn = 200
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
server_round_robin = 0

; Timeouts (conservative defaults)
idle_transaction_timeout = 0
server_idle_timeout = 0

; Misc
ignore_startup_parameters = extra_float_digits
log_connections = 1
log_disconnections = 1
