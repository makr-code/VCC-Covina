# VCC-Covina Kong Declarative Configuration
# Phase 1: Foundation Enhancement - API Gateway Routes
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
  namespace: covina
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: api-gateway
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true

    # Services definition
    services:
      # Main Backend Service
      - name: covina-main-backend
        url: http://covina-main-backend.covina.svc.cluster.local:45678
        retries: 3
        connect_timeout: 5000
        write_timeout: 60000
        read_timeout: 60000
        routes:
          - name: main-api-route
            paths:
              - /api/v1/search
              - /api/v1/query
              - /api/v1/dsgvo
              - /api/v1/review
              - /health
            methods:
              - GET
              - POST
              - PUT
              - DELETE
            strip_path: false
            preserve_host: true

      # Ingestion Backend Service
      - name: covina-ingestion-backend
        url: http://covina-ingestion-backend.covina.svc.cluster.local:45679
        retries: 3
        connect_timeout: 5000
        write_timeout: 300000  # 5 minutes for large uploads
        read_timeout: 300000
        routes:
          - name: ingestion-api-route
            paths:
              - /api/v1/upload
              - /api/v1/jobs
              - /api/v1/files
            methods:
              - GET
              - POST
              - PUT
              - DELETE
            strip_path: false
            preserve_host: true

    # Plugins configuration
    plugins:
      # Rate Limiting (per client IP)
      - name: rate-limiting
        config:
          minute: 1000
          hour: 10000
          policy: local
          fault_tolerant: true
          hide_client_headers: false
          redis_ssl: false

      # Request/Response Logging
      - name: file-log
        config:
          path: /dev/stdout
          reopen: true

      # CORS Configuration
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Request-ID
            - X-Correlation-ID
          exposed_headers:
            - X-Request-ID
            - X-Correlation-ID
          credentials: true
          max_age: 3600

      # Request Transformer (add correlation ID)
      - name: correlation-id
        config:
          header_name: X-Correlation-ID
          generator: uuid
          echo_downstream: true

      # Prometheus Metrics Export
      - name: prometheus
        config:
          status_code_metrics: true
          latency_metrics: true
          bandwidth_metrics: true
          upstream_health_metrics: true

    # Consumers (for API key authentication - optional)
    consumers:
      - username: vcc-internal
        keyauth_credentials:
          - key: INTERNAL_API_KEY_PLACEHOLDER

    # Upstreams with health checks
    upstreams:
      - name: covina-main-backend-upstream
        healthchecks:
          active:
            healthy:
              interval: 5
              successes: 2
            unhealthy:
              interval: 5
              http_failures: 3
            type: http
            http_path: /health
            timeout: 3
          passive:
            healthy:
              successes: 2
            unhealthy:
              http_failures: 3
        targets:
          - target: covina-main-backend.covina.svc.cluster.local:45678
            weight: 100

      - name: covina-ingestion-backend-upstream
        healthchecks:
          active:
            healthy:
              interval: 5
              successes: 2
            unhealthy:
              interval: 5
              http_failures: 3
            type: http
            http_path: /health
            timeout: 3
        targets:
          - target: covina-ingestion-backend.covina.svc.cluster.local:45679
            weight: 100
