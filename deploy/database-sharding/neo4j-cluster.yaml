# VCC-Covina Neo4j Causal Cluster Configuration
# Phase 4: Enterprise Scale - Graph Database Clustering
# All on-premise, no vendor dependencies

---
# Neo4j Core StatefulSet (Causal Cluster)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j-core
  namespace: covina
  labels:
    app: neo4j
    component: core
spec:
  serviceName: neo4j-core
  replicas: 3  # 3-node core cluster for HA
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: neo4j
      component: core
  template:
    metadata:
      labels:
        app: neo4j
        component: core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2004"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        fsGroup: 7474
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - neo4j
                  - key: component
                    operator: In
                    values:
                      - core
              topologyKey: kubernetes.io/hostname
      containers:
        - name: neo4j
          image: neo4j:5.15.0-enterprise
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
            - containerPort: 6362
              name: backup
            - containerPort: 5000
              name: discovery
            - containerPort: 7000
              name: raft
            - containerPort: 2004
              name: metrics
          env:
            # Enterprise features
            - name: NEO4J_ACCEPT_LICENSE_AGREEMENT
              value: "yes"
            
            # Cluster configuration
            - name: NEO4J_causal__clustering_minimum__core__cluster__size__at__formation
              value: "3"
            - name: NEO4J_causal__clustering_minimum__core__cluster__size__at__runtime
              value: "2"
            - name: NEO4J_causal__clustering_discovery__type
              value: "K8S"
            - name: NEO4J_causal__clustering_kubernetes_label__selector
              value: "app=neo4j,component=core"
            - name: NEO4J_causal__clustering_kubernetes_service__port__name
              value: "discovery"
            
            # Server mode
            - name: NEO4J_server_default__listen__address
              value: "0.0.0.0"
            - name: NEO4J_server_default__advertised__address
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NEO4J_dbms_mode
              value: "CORE"
            
            # Memory configuration
            - name: NEO4J_server_memory_heap_initial__size
              value: "4G"
            - name: NEO4J_server_memory_heap_max__size
              value: "8G"
            - name: NEO4J_server_memory_pagecache_size
              value: "8G"
            
            # Authentication
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: auth
            
            # Metrics
            - name: NEO4J_server_metrics_enabled
              value: "true"
            - name: NEO4J_server_metrics_prometheus_enabled
              value: "true"
            - name: NEO4J_server_metrics_prometheus_endpoint
              value: "0.0.0.0:2004"
            
            # Security
            - name: NEO4J_dbms_security_procedures_unrestricted
              value: "apoc.*,gds.*"
            - name: NEO4J_dbms_security_procedures_allowlist
              value: "apoc.*,gds.*"
            
            # Logging
            - name: NEO4J_dbms_logs_query_enabled
              value: "INFO"
            - name: NEO4J_dbms_logs_query_threshold
              value: "5s"
          
          resources:
            requests:
              cpu: 2000m
              memory: 16Gi
            limits:
              cpu: 8000m
              memory: 32Gi
          
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
            - name: plugins
              mountPath: /plugins
          
          livenessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          
          readinessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
      
      initContainers:
        # Download APOC and GDS plugins
        - name: init-plugins
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cd /plugins
              wget -q https://github.com/neo4j/apoc/releases/download/5.15.0/apoc-5.15.0-core.jar
              wget -q https://github.com/neo4j/graph-data-science/releases/download/2.6.1/neo4j-graph-data-science-2.6.1.jar
          volumeMounts:
            - name: plugins
              mountPath: /plugins
      
      volumes:
        - name: plugins
          emptyDir: {}
  
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-ssd
        resources:
          requests:
            storage: 500Gi
    - metadata:
        name: logs
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-ssd
        resources:
          requests:
            storage: 50Gi

---
# Neo4j Read Replicas (Optional - for read scaling)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j-replica
  namespace: covina
  labels:
    app: neo4j
    component: replica
spec:
  serviceName: neo4j-replica
  replicas: 2  # 2 read replicas
  selector:
    matchLabels:
      app: neo4j
      component: replica
  template:
    metadata:
      labels:
        app: neo4j
        component: replica
    spec:
      securityContext:
        fsGroup: 7474
      containers:
        - name: neo4j
          image: neo4j:5.15.0-enterprise
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
          env:
            - name: NEO4J_ACCEPT_LICENSE_AGREEMENT
              value: "yes"
            - name: NEO4J_dbms_mode
              value: "READ_REPLICA"
            - name: NEO4J_causal__clustering_discovery__type
              value: "K8S"
            - name: NEO4J_causal__clustering_kubernetes_label__selector
              value: "app=neo4j,component=core"
            - name: NEO4J_causal__clustering_kubernetes_service__port__name
              value: "discovery"
            - name: NEO4J_server_default__listen__address
              value: "0.0.0.0"
            - name: NEO4J_server_memory_heap_initial__size
              value: "2G"
            - name: NEO4J_server_memory_heap_max__size
              value: "4G"
            - name: NEO4J_server_memory_pagecache_size
              value: "4G"
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: auth
          resources:
            requests:
              cpu: 1000m
              memory: 8Gi
            limits:
              cpu: 4000m
              memory: 16Gi
          volumeMounts:
            - name: data
              mountPath: /data
  
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-ssd
        resources:
          requests:
            storage: 200Gi

---
# Neo4j Core Headless Service (for cluster discovery)
apiVersion: v1
kind: Service
metadata:
  name: neo4j-core
  namespace: covina
  labels:
    app: neo4j
    component: core
spec:
  clusterIP: None
  ports:
    - port: 7474
      targetPort: 7474
      name: http
    - port: 7687
      targetPort: 7687
      name: bolt
    - port: 5000
      targetPort: 5000
      name: discovery
    - port: 7000
      targetPort: 7000
      name: raft
    - port: 6362
      targetPort: 6362
      name: backup
    - port: 2004
      targetPort: 2004
      name: metrics
  selector:
    app: neo4j
    component: core

---
# Neo4j Bolt Service (for client connections)
apiVersion: v1
kind: Service
metadata:
  name: neo4j-bolt
  namespace: covina
  labels:
    app: neo4j
spec:
  type: ClusterIP
  ports:
    - port: 7687
      targetPort: 7687
      name: bolt
  selector:
    app: neo4j

---
# Neo4j HTTP Service (for browser and REST API)
apiVersion: v1
kind: Service
metadata:
  name: neo4j-http
  namespace: covina
  labels:
    app: neo4j
spec:
  type: ClusterIP
  ports:
    - port: 7474
      targetPort: 7474
      name: http
  selector:
    app: neo4j

---
# Neo4j Read Service (routes to replicas when available)
apiVersion: v1
kind: Service
metadata:
  name: neo4j-read
  namespace: covina
  labels:
    app: neo4j
spec:
  type: ClusterIP
  ports:
    - port: 7687
      targetPort: 7687
      name: bolt
    - port: 7474
      targetPort: 7474
      name: http
  selector:
    app: neo4j
    component: replica

---
# Neo4j Credentials
apiVersion: v1
kind: Secret
metadata:
  name: neo4j-credentials
  namespace: covina
type: Opaque
stringData:
  auth: neo4j/CHANGE_ME_IN_PRODUCTION

---
# Neo4j Core PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: neo4j-core-pdb
  namespace: covina
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: neo4j
      component: core

---
# Neo4j RBAC for Kubernetes discovery
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: neo4j-discovery
  namespace: covina
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: neo4j-discovery
  namespace: covina
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: neo4j-discovery
subjects:
  - kind: ServiceAccount
    name: default
    namespace: covina

---
# Neo4j HPA for Read Replicas
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neo4j-replica-hpa
  namespace: covina
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: neo4j-replica
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 180
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
