# Apache Kafka Deployment (On-Premise)
# Phase 2: VCC Ecosystem Integration - Event-Driven Architecture
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: covina
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: event-bus
data:
  # Kafka Broker Configuration
  server.properties: |
    # Broker ID (unique per broker)
    broker.id=0
    
    # Network Configuration
    listeners=PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:9093
    advertised.listeners=PLAINTEXT://kafka-0.kafka-headless.covina.svc.cluster.local:9092,INTERNAL://kafka-0.kafka-headless.covina.svc.cluster.local:9093
    listener.security.protocol.map=PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
    inter.broker.listener.name=INTERNAL
    
    # Log Configuration
    log.dirs=/var/lib/kafka/data
    num.partitions=3
    default.replication.factor=3
    min.insync.replicas=2
    
    # Retention
    log.retention.hours=168
    log.retention.bytes=10737418240
    log.segment.bytes=1073741824
    
    # Zookeeper (will migrate to KRaft in future)
    zookeeper.connect=zookeeper-headless.covina.svc.cluster.local:2181
    zookeeper.connection.timeout.ms=6000
    
    # Performance Tuning
    num.network.threads=3
    num.io.threads=8
    socket.send.buffer.bytes=102400
    socket.receive.buffer.bytes=102400
    socket.request.max.bytes=104857600
    
    # Cleanup
    log.cleaner.enable=true
    
  # VCC Topic Configuration
  topics.yaml: |
    topics:
      - name: vcc.documents.ingested
        partitions: 6
        replicationFactor: 3
        config:
          retention.ms: 604800000  # 7 days
          cleanup.policy: delete
          
      - name: vcc.documents.processed
        partitions: 6
        replicationFactor: 3
        config:
          retention.ms: 604800000
          
      - name: vcc.compliance.events
        partitions: 3
        replicationFactor: 3
        config:
          retention.ms: 2592000000  # 30 days
          
      - name: vcc.audit.log
        partitions: 3
        replicationFactor: 3
        config:
          retention.ms: 31536000000  # 365 days
          cleanup.policy: delete
          
      - name: vcc.veritas.requests
        partitions: 3
        replicationFactor: 3
        
      - name: vcc.veritas.responses
        partitions: 3
        replicationFactor: 3
        
      - name: vcc.themis.sync
        partitions: 3
        replicationFactor: 3
        config:
          retention.ms: 86400000  # 1 day
---
# Zookeeper StatefulSet (required for Kafka)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: covina
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/component: coordination
spec:
  serviceName: zookeeper-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zookeeper
        app.kubernetes.io/component: coordination
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.5.0
        ports:
        - containerPort: 2181
          name: client
        - containerPort: 2888
          name: server
        - containerPort: 3888
          name: leader-election
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        - name: ZOOKEEPER_INIT_LIMIT
          value: "5"
        - name: ZOOKEEPER_SYNC_LIMIT
          value: "2"
        - name: ZOOKEEPER_SERVER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: ZOOKEEPER_SERVERS
          value: "zookeeper-0.zookeeper-headless.covina.svc.cluster.local:2888:3888;zookeeper-1.zookeeper-headless.covina.svc.cluster.local:2888:3888;zookeeper-2.zookeeper-headless.covina.svc.cluster.local:2888:3888"
        volumeMounts:
        - name: data
          mountPath: /var/lib/zookeeper/data
        - name: log
          mountPath: /var/lib/zookeeper/log
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-storage
      resources:
        requests:
          storage: 5Gi
  - metadata:
      name: log
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-storage
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-headless
  namespace: covina
  labels:
    app.kubernetes.io/name: zookeeper
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 2181
    name: client
  - port: 2888
    name: server
  - port: 3888
    name: leader-election
  selector:
    app.kubernetes.io/name: zookeeper
---
# Kafka StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: covina
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: event-bus
spec:
  serviceName: kafka-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: event-bus
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9308"
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.5.0
        ports:
        - containerPort: 9092
          name: external
        - containerPort: 9093
          name: internal
        env:
        - name: KAFKA_BROKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper-headless.covina.svc.cluster.local:2181"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:9093"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://$(HOSTNAME).kafka-headless.covina.svc.cluster.local:9092,INTERNAL://$(HOSTNAME).kafka-headless.covina.svc.cluster.local:9093"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "INTERNAL"
        - name: KAFKA_NUM_PARTITIONS
          value: "3"
        - name: KAFKA_DEFAULT_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_MIN_INSYNC_REPLICAS
          value: "2"
        - name: KAFKA_LOG_RETENTION_HOURS
          value: "168"
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: "false"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "2"
        - name: KAFKA_JMX_PORT
          value: "9999"
        - name: KAFKA_JMX_HOSTNAME
          value: "localhost"
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 60
          periodSeconds: 20
      # Kafka Exporter for Prometheus metrics
      - name: kafka-exporter
        image: danielqsj/kafka-exporter:latest
        ports:
        - containerPort: 9308
          name: metrics
        args:
        - --kafka.server=localhost:9092
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-storage
      resources:
        requests:
          storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: covina
  labels:
    app.kubernetes.io/name: kafka
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 9092
    name: external
  - port: 9093
    name: internal
  selector:
    app.kubernetes.io/name: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: covina
  labels:
    app.kubernetes.io/name: kafka
spec:
  type: ClusterIP
  ports:
  - port: 9092
    targetPort: 9092
    protocol: TCP
    name: external
  selector:
    app.kubernetes.io/name: kafka
---
# Schema Registry for Avro schemas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: covina
  labels:
    app.kubernetes.io/name: schema-registry
    app.kubernetes.io/component: event-bus
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: schema-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-registry
        app.kubernetes.io/component: event-bus
    spec:
      containers:
      - name: schema-registry
        image: confluentinc/cp-schema-registry:7.5.0
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: SCHEMA_REGISTRY_HOST_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
          value: "kafka-headless.covina.svc.cluster.local:9092"
        - name: SCHEMA_REGISTRY_LISTENERS
          value: "http://0.0.0.0:8081"
        - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
          value: "3"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: covina
  labels:
    app.kubernetes.io/name: schema-registry
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: schema-registry
