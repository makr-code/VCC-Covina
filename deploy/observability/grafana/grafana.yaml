# Grafana Configuration
# Phase 1: Foundation Enhancement - Observability Stack
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: covina-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
data:
  grafana.ini: |
    [analytics]
    check_for_updates = false
    reporting_enabled = false
    
    [server]
    root_url = %(protocol)s://%(domain)s/grafana/
    serve_from_sub_path = true
    
    [security]
    admin_user = admin
    admin_password = ${GF_SECURITY_ADMIN_PASSWORD}
    disable_gravatar = true
    
    [users]
    allow_sign_up = false
    
    [auth.anonymous]
    enabled = false
    
    [log]
    mode = console
    level = info
    
    [dashboards]
    default_home_dashboard_path = /var/lib/grafana/dashboards/covina-overview.json

  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.covina-observability.svc.cluster.local:9090
        isDefault: true
        editable: false
      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger-query.covina-observability.svc.cluster.local:16686
        editable: false
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.covina-observability.svc.cluster.local:3100
        editable: false

  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: 'VCC-Covina'
        folderUid: 'covina'
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: covina-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboards
data:
  covina-overview.json: |
    {
      "dashboard": {
        "id": null,
        "uid": "covina-overview",
        "title": "VCC-Covina Overview",
        "tags": ["covina", "vcc"],
        "timezone": "browser",
        "refresh": "30s",
        "schemaVersion": 38,
        "panels": [
          {
            "id": 1,
            "title": "Request Rate",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "sum(rate(http_requests_total{job=~\"covina.*\"}[5m]))",
                "legendFormat": "req/s"
              }
            ]
          },
          {
            "id": 2,
            "title": "Error Rate",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
            "targets": [
              {
                "expr": "sum(rate(http_requests_total{job=~\"covina.*\",status=~\"5..\"}[5m])) / sum(rate(http_requests_total{job=~\"covina.*\"}[5m])) * 100",
                "legendFormat": "error %"
              }
            ]
          },
          {
            "id": 3,
            "title": "P95 Latency",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=~\"covina.*\"}[5m])) by (le))",
                "legendFormat": "latency"
              }
            ]
          },
          {
            "id": 4,
            "title": "Active Connections",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
            "targets": [
              {
                "expr": "sum(http_connections_current{job=~\"covina.*\"})",
                "legendFormat": "connections"
              }
            ]
          },
          {
            "id": 5,
            "title": "Request Rate Over Time",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
            "targets": [
              {
                "expr": "sum(rate(http_requests_total{job=\"covina-main-backend\"}[1m]))",
                "legendFormat": "Main Backend"
              },
              {
                "expr": "sum(rate(http_requests_total{job=\"covina-ingestion-backend\"}[1m]))",
                "legendFormat": "Ingestion Backend"
              }
            ]
          },
          {
            "id": 6,
            "title": "Response Time Distribution",
            "type": "heatmap",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
            "targets": [
              {
                "expr": "sum(rate(http_request_duration_seconds_bucket{job=~\"covina.*\"}[5m])) by (le)",
                "legendFormat": "{{le}}"
              }
            ]
          }
        ]
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: covina-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: visualization
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.2.0
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-secrets
              key: admin-password
        volumeMounts:
        - name: config
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
        - name: config
          mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          subPath: datasources.yaml
        - name: config
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
          subPath: dashboards.yaml
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
        - name: data
          mountPath: /var/lib/grafana
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: grafana-config
      - name: dashboards
        configMap:
          name: grafana-dashboards
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: covina-observability
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: grafana
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data-pvc
  namespace: covina-observability
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: covina-observability
type: Opaque
stringData:
  admin-password: "CHANGE_ME_GRAFANA_ADMIN_PASSWORD"
