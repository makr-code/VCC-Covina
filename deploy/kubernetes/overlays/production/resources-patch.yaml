# Production Resources Configuration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: covina-main-backend
spec:
  template:
    spec:
      containers:
      - name: main-backend
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "4000m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: covina-ingestion-backend
spec:
  template:
    spec:
      containers:
      - name: ingestion-backend
        resources:
          requests:
            memory: "2Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "8000m"
