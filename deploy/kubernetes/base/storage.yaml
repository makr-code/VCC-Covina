# VCC-Covina Persistent Volume Claims
# Phase 1: Foundation Enhancement
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: covina-data-pvc
  namespace: covina
  labels:
    app.kubernetes.io/name: covina
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: local-storage
  resources:
    requests:
      storage: 50Gi
---
