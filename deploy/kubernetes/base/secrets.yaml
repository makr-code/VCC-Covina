# VCC-Covina Secrets Template
# Phase 1: Foundation Enhancement
# NOTE: Replace placeholder values with actual secrets before deploying
apiVersion: v1
kind: Secret
metadata:
  name: covina-secrets
  namespace: covina
  labels:
    app.kubernetes.io/name: covina
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database Credentials (on-premise)
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME_POSTGRES_PASSWORD"
  
  # Neo4j Credentials (self-hosted)
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "CHANGE_ME_NEO4J_PASSWORD"
  
  # CouchDB Credentials (self-hosted)
  COUCHDB_USER: "admin"
  COUCHDB_PASSWORD: "CHANGE_ME_COUCHDB_PASSWORD"
  
  # Redis Password (on-premise)
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
  
  # JWT Secret for internal authentication
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_MIN_32_CHARS"
  
  # API Keys for internal services
  INTERNAL_API_KEY: "CHANGE_ME_INTERNAL_API_KEY"
