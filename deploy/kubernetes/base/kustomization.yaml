# VCC-Covina Kustomization Base
# Phase 1: Foundation Enhancement
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: covina

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - storage.yaml
  - main-backend-deployment.yaml
  - ingestion-backend-deployment.yaml

commonLabels:
  app.kubernetes.io/part-of: vcc-ecosystem
  app.kubernetes.io/managed-by: kustomize

configMapGenerator:
  - name: covina-version
    literals:
      - VERSION=3.4.11
      - PHASE=phase-1-foundation
