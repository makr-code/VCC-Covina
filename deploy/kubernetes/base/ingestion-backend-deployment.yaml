# VCC-Covina Ingestion Backend Deployment
# Phase 1: Foundation Enhancement
apiVersion: apps/v1
kind: Deployment
metadata:
  name: covina-ingestion-backend
  namespace: covina
  labels:
    app.kubernetes.io/name: covina
    app.kubernetes.io/component: ingestion-backend
    app.kubernetes.io/version: "3.4.11"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: covina
      app.kubernetes.io/component: ingestion-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: covina
        app.kubernetes.io/component: ingestion-backend
        app.kubernetes.io/version: "3.4.11"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "45679"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: covina-service-account
      containers:
      - name: ingestion-backend
        image: registry.local/covina/ingestion-backend:3.4.11
        imagePullPolicy: Always
        ports:
        - containerPort: 45679
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: covina-config
        - secretRef:
            name: covina-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "4000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 45679
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 45679
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: upload-volume
          mountPath: /app/data/uploads
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: upload-volume
        persistentVolumeClaim:
          claimName: covina-uploads-pvc
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                  - ingestion-backend
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: covina-ingestion-backend
  namespace: covina
  labels:
    app.kubernetes.io/name: covina
    app.kubernetes.io/component: ingestion-backend
spec:
  type: ClusterIP
  ports:
  - port: 45679
    targetPort: 45679
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: covina
    app.kubernetes.io/component: ingestion-backend
